name: Deploy Cloudflare Worker

on:
  workflow_call:
    inputs:
      environment:
        description: Wrangler environment (staging or production)
        required: true
        type: string
      smoke-test-url:
        description: Health check origin; defaults to the deployment URL
        default: ''
        type: string
      smoke-test-access:
        description: Authenticate the health check with Cloudflare Access
        default: false
        type: boolean
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_ACCESS_CLIENT_ID:
        required: false
      CLOUDFLARE_ACCESS_CLIENT_SECRET:
        required: false

permissions:
  contents: read

jobs:
  # Staging has no GitHub environment. Keep production's environment on
  # its runner job so its protection rules and environment secrets apply.
  staging:
    runs-on: ubuntu-latest
    if: github.repository == 'spacecubics/asciiweave' && inputs.environment == 'staging'
    steps: &deploy-steps
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node

      - name: Run checks
        run: |
          npm run typecheck
          npm test
          npm run test:workers

      - name: Build the browser app
        run: npm run build

      - name: Migrate ${{ inputs.environment }} D1 and deploy the ${{ inputs.environment }} Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pin to the repository's Wrangler version.
          packageManager: npm
          preCommands: npx wrangler d1 migrations apply DB --remote --env ${{ inputs.environment }}
          command: deploy --env ${{ inputs.environment }} --var GIT_COMMIT:${{ github.sha }}

      - name: Smoke test (non-destructive)
        env:
          SMOKE_TEST_URL: ${{ inputs.smoke-test-url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          SMOKE_TEST_ACCESS: ${{ inputs.smoke-test-access }}
          ACCESS_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          ACCESS_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          DEPLOYED_COMMIT: ${{ github.sha }}
        run: bash .github/scripts/deployment-smoke.sh

  production:
    runs-on: ubuntu-latest
    environment: production
    if: github.repository == 'spacecubics/asciiweave' && inputs.environment == 'production'
    steps: *deploy-steps
